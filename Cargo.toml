[package]
name = "dos-2-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "dos2_editor"
path = "src/lib.rs"

[[bin]]
name = "dos-2-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts"] }
egui = "0.31"
rfd = "0.15"
lz4_flex = "0.11"
flate2 = "1"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
strip = true
